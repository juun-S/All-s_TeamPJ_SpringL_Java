
name: Black Duck Security Scan
on:
  push:
    branches:
      - main
      - master
      - develop
      - stage
      - release
      - middle_main
      - forBlackDuckSCAWorkflow
  pull_request:
    branches:
      - main
      - master
      - develop
      - stage
      - release
      - middle_main
      - forBlackDuckSCAWorkflow
  workflow_dispatch: {}
jobs:
  blackducksca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # git diff를 위해 전체 히스토리 가져오기

      - name: Extract changed code
        id: extract_code
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Pull Request: base와 head 브랜치 사이의 변경분 추출
            git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          else
            # Push: 이전 커밋과 현재 커밋 사이의 변경분 추출
            git diff ${{ github.event.before }} ${{ github.sha }}
          fi | \
          grep -E "^\+" | \
          # --- a/file, +++ b/file 같은 diff 헤더 라인 제외
          grep -Ev "^\+\+\+" > changed_code.txt || true
          
          # 변경된 코드가 있는지 확인
          if [ -s changed_code.txt ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Scan snippet with Black Duck API
        if: steps.extract_code.outputs.changed == 'true'
        id: bd_scan
        run: |
          # jq 설치 (러너에 포함되어 있지만 명시적으로 설치)
          sudo apt-get update && sudo apt-get install -y jq

          # 1. Bearer 토큰 획득
          BD_URL="${{ vars.BLACKDUCKSCA_URL }}"
          API_TOKEN="${{ secrets.BLACKDUCKSCA_TOKEN }}"
          RESPONSE=$(curl -s -X POST \
            --header "Authorization: token ${API_TOKEN}" \
            "${BD_URL}api/tokens/authenticate")
          BEARER_TOKEN=$(echo "${RESPONSE}" | jq -r '.bearerToken')

          # 2. 스니펫 스캔 실행
          SCAN_RESULTS=$(cat changed_code.txt | curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -H "Content-Type: text/plain" \
            -H "Accept: application/json" \
            --data-binary @- \
            "${BD_URL}api/snippet-matching")
          
          HTTP_CODE=$(echo "$SCAN_RESULTS" | tail -n1)
          BODY=$(echo "$SCAN_RESULTS" | sed '$d')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "API 호출 실패 (HTTP 코드: $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

          # 결과를 파일에 저장하여 다음 단계로 전달
          echo "$BODY" > scan_results.json
          echo "scan_completed=true" >> $GITHUB_OUTPUT

      - name: Process scan results and comment on PR
        if: steps.bd_scan.outputs.scan_completed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const response = JSON.parse(fs.readFileSync('scan_results.json', 'utf8'));
            const results = response.items || []; // API 응답의 items 배열을 사용합니다.
            
            if (results.length === 0) {
              console.log('No snippet matches found.');
              return;
            }

            let high_risk_found = false;
            let comment_body = '### :shield: Black Duck 스니펫 스캔 결과\n\n';
            comment_body += 'Pull Request에 추가된 코드에서 다음과 같은 오픈소스 스니펫이 발견되었습니다.\n\n';
            const highRiskFamilies = ['RECIPROCAL', 'AGPL'];
            for (const match of results) {
              const family = match.licenseFamily || 'UNKNOWN';
              let emoji = '🟢';
              if (highRiskFamilies.includes(family)) {
                emoji = '🔴';
                high_risk_found = true;
              } else if (family === 'WEAK_RECIPROCAL') {
                emoji = '🟡';
              }
              comment_body += `- ${emoji} **${match.matchingComponent}@${match.version}**\n`;
              comment_body += `  - **라이선스:** ${match.licenseName} (패밀리: ${family})\n`;
            }

            if (high_risk_found) {
              comment_body += '\n\n**조치 필요:** 🔴 높은 리스크의 라이선스(RECIPROCAL, AGPL)가 발견되었습니다. 병합 전 법무/컴플라이언스팀의 검토가 필요합니다.';
              core.setFailed('높은 리스크의 라이선스가 포함된 스니펫이 발견되었습니다.');
            } else {
              comment_body += '\n\n**참고:** 🟢 발견된 스니펫은 허용 가능한 라이선스 정책 범위 내에 있습니다.';
            }

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment_body
              });
            }
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Black Duck Security Scan
        id: black-duck-security-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          blackducksca_waitForScan: true
          mark_build_status: failure
          include_diagnostics: true
          blackducksca_prComment_enabled: true
          github_token: ${{ secrets.GH_TOKEN }}
          blackducksca_fixpr_enabled: true
          blackducksca_reports_sarif_create: true
          blackducksca_upload_sarif_report: true
