name: Black Duck Security Scan
on:
  push:
    branches:
      - middle_main
  pull_request:
    branches:
      - middle_main
  workflow_dispatch: {}
jobs:
  blackducksca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Black Duck Security Scan
        id: black-duck-security-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          blackducksca_waitForScan: true
          mark_build_status: failure
          include_diagnostics: true
          blackduck_prComment_enabled: true
          github_token: ${{ secrets.GH_TOKEN }}
          blackduck_fixpr_enabled: true
          blackduck_reports_sarif_create: true
          blackduck_upload_sarif_report: true
          detect_args: >
            --detect.blackduck.scan.mode=RAPID
            --detect.excluded.detector.types=GIT
            --detect.project.name=AllsJenkins
            --detect.project.version.name=No.84_Branch:middle_main
            --blackduck.trust.cert=true
            --detect.accuracy.required=NONE
            --detect.timeout=5000
