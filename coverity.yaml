# Coverity configuration file.
# The schema is available here: <install-dir>/doc/configuration-schema.json
# For help on individual settings:      coverity help config --setting <setting>
# For a complete example configuration: coverity help config --show-all
# For help on configuration syntax:     coverity help config --syntax
capture:
  build-command-inference: true
  emit-complementary-info: false
  encoding: UTF-8
  failure-threshold-percent: 0
  force-dependency-resolution: false
  minimal-classpath-emit: false
  record-with-source: false
  security-da: true
  build:
    aspnet-compiler: true
    bazel: false
    build-command: mvn package 
    clean-command: mvn clean
    defer-decomp: false
    instrument: false
    scan-transparency: true
  languages:
    include:
      - java
  compiler-configuration:
    cov-configure:
      - [--java]
      
analyze:
  aggressiveness-level: low
  c-cpp-fnptr: false
  c-cpp-virtual: false
  callgraph-metrics: false
  constraint-fpp: false
  location: local
  mode: pfi
  one-tu-per-psf: true
  scan-transparency: true
  checkers:
    all: false
    all-security: false
    android-security: true
    audit: false
    brakeman: true
    c-family-security: false
    concurrency: false
    default: true
    pmd: true
    rule: false
# Specifies where the analysis results should be sent.
commit:

  # Coverity Connect configuration to use when committing defects to Coverity
  # Connect.
  connect:

    # The name of the stream to commit the results to.
    stream: allsDoMySelf

    # Absolute URL of where to commit the Coverity Connect results.
    url: https://sflab.coverity.service.softflow.zone:443
